appId: com.dolatzaban.app
productName: Dolat Zaban
directories:
  output: dist
  buildResources: build
compression: maximum
files:
  - electron/**/*
  - package.json
  # the app is fully self-contained in out/ (extraResources) — none of the
  # web app's npm dependencies are needed at runtime
  - "!node_modules/**/*"
extraResources:
  - from: out
    to: app.asar.unpacked/out
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: Dolat-Zaban-Setup-v${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dolat Zaban
